name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=atlas --cov-report=term-missing --cov-fail-under=85

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Vulnerabilidades conocidas en dependencias
        run: |
          pip install pip-audit
          pip install ".[ai]"
          pip-audit --skip-editable

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t atlas-one:ci .
      - name: Smoke test container
        run: |
          docker run -d --name atlas -p 8000:8000 -e ATLAS_RANDOM_ANOMALIES=0 atlas-one:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/readyz && break; sleep 1; done
          curl -fs -X POST localhost:8000/api/control -H 'Content-Type: application/json' -d '{"next_day": true, "running": false}'
          curl -fs -X POST localhost:8000/api/scenarios/carga_duplicada
          curl -fs -X POST localhost:8000/api/control -H 'Content-Type: application/json' -d '{"finish_day": true}'
          curl -fs localhost:8000/api/state | python -c "import json,sys; s=json.load(sys.stdin); assert s['kpis']['tables_arrived'] == 6; assert s['kpis']['open_incidents'] >= 1"
          docker logs atlas | tail -20
