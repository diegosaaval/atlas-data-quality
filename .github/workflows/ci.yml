name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=atlas --cov-report=term-missing --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t atlas-one:ci .
      - name: Smoke test container
        run: |
          docker run -d --name atlas -p 8000:8000 atlas-one:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/readyz && break; sleep 1; done
          curl -fs localhost:8000/api/state | python -c "import json,sys; s=json.load(sys.stdin); assert s['platform']['score'] > 90"
          curl -fs -X POST localhost:8000/api/faults/schema_drift -H 'Content-Type: application/json' -d '{}'
          sleep 4
          curl -fs "localhost:8000/api/incidents?status=open" | python -c "import json,sys; assert json.load(sys.stdin)"
          docker logs atlas | tail -20
