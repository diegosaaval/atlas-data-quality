[project]
name = "atlas-one"
version = "0.1.0"
description = "Reference implementation of a data reliability platform for financial data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas"]

[tool.setuptools.package-data]
atlas = ["contracts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI dependencies in defaults are idiomatic
