[project]
name = "atlas-data-quality"
version = "1.1.0"
description = "Monitor de calidad de datos: valida las tablas que se cargan cada día y gestiona incidentes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
conectores = ["duckdb>=1.1"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pytest-cov>=5", "duckdb>=1.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas"]

[tool.setuptools.package-data]
atlas = ["contracts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM108"]  # FastAPI defaults are idiomatic; explicit if/else reads better here
