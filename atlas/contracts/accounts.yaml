dataset: bronze.accounts
version: 1.4.0
owner: core-banking
description: Customer accounts from the core banking CDC feed.
primary_key: [account_id]
freshness_sla_minutes: 30
columns:
  account_id: {type: string, required: true, pattern: "^ACC-", classification: confidential}
  segment:    {type: string, required: true, enum: [retail, sme, corporate]}
  risk_tier:  {type: string, required: true, enum: [low, medium, high]}
  status:     {type: string, required: true, enum: [active, frozen, closed]}
  opened_at:  {type: timestamp, required: true}
  holder_name: {type: string, required: true, classification: pii}
